version: "3.9"

services:
  fastapi:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    depends_on:
      - mongodb-primary
      - mongodb-secondary
    networks:
      - mongos-network

  mongodb-primary:
    image: mongo:latest
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--auth",
        "--keyFile",
        "/etc/mongod-keyfile",
      ]
    ports:
      - "27017:27017"
    networks:
      - mongos-network
    volumes:
      - ./mongo/data/primary:/data/db
      - ./mongo/etc/init/:/docker-entrypoint-initdb.d/:ro
      - ./mongo/etc/mongod-keyfile:/etc/mongod-keyfile:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password

  mongodb-secondary:
    image: mongo:latest
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--auth",
        "--keyFile",
        "/etc/mongod-keyfile",
      ]
    ports:
      - "27018:27017"
    networks:
      - mongos-network
    volumes:
      - ./mongo/data/secondary:/data/db
      - ./mongo/etc/mongod-keyfile:/etc/mongod-keyfile:ro

networks:
  mongos-network:
